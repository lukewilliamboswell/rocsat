name: source-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.roc
          key: roc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('roc-version', 'scripts/roc-checksums') }}
      - name: Install pinned Roc compiler
        run: scripts/install-roc
      - name: Check source, harness, and public API consumer
        run: make source-check
      - name: Check roc-fuzz suite examples
        run: make fuzz-check
